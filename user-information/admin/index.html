<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin - User Information</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Admin</h1>
      <p>Everyone who has submitted the form.</p>
    </header>
    <section class="panel" aria-labelledby="table-title">
      <div class="table-head">
        <h2 id="table-title">Submitted entries <span class="count" id="count">0</span></h2>
        <button type="button" class="btn btn-ghost" id="refresh-btn">Refresh</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>#</th><th>Name</th><th>Email</th><th>Submitted</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
